# wrangler.toml — Cloudflare Worker config for the Rapido quote tool.
#
# Deploy:   npx wrangler deploy
# Secret:   npx wrangler secret put SMARTMOVING_PROVIDER_KEY   (never commit it)
# Dev:      npx wrangler dev
#
# The [vars] below are NON-secret config. The SmartMoving provider key is NOT
# here -- it is a secret (see the bottom of this file).

# Worker name must match the Cloudflare Workers Build connected to this repo.
name = "quotecalculatorrapido"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Import the front-end widget (elementor/widget.client.txt) as a string so the
# Worker can serve it at GET /widget.js. The .txt extension avoids colliding
# with the default JS/ESM module rules.
[[rules]]
type = "Text"
globs = ["**/*.txt"]

# ---------------------------------------------------------------------------
# Non-secret configuration (safe to commit). Replace every <PLACEHOLDER>.
# ---------------------------------------------------------------------------
[vars]
# CORS — lock to Rapido's live origin(s). Comma-separated if more than one.
ALLOWED_ORIGIN = "https://servicerapido.com,https://www.servicerapido.com"

# Basic per-IP rate limit (abuse guard). Tune after watching real traffic.
RATE_LIMIT_WINDOW_MS = "60000"
RATE_LIMIT_MAX = "8"

# --- SmartMoving (CRM) ---
# The lead endpoint is:
#   POST https://api.smartmoving.com/api/leads/from-provider/v2?providerKey=...
# The provider key IS the credential, so it is a secret, not a var here (see
# below). Look it up in SmartMoving: Settings -> Sales -> Lead Providers ->
# Your Website -> View Instructions.
#
# Optional: route every lead to one SmartMoving branch. Leave unset (or as a
# <PLACEHOLDER>) to let SmartMoving assign the branch itself.
# SMARTMOVING_BRANCH_ID = "<BRANCH_ID>"
#
# SmartMoving takes the address as street / city / state / zip, but the form
# collects one free-text line, so the Worker splits it: it geocodes the address
# (see geocode() in src/worker.js) and falls back to a local comma-parse, then
# to the raw line as the street. Geocoding works keyless by default (Nominatim,
# with a Photon fallback so a throttled lookup still resolves). For guaranteed
# reliability at volume, set the optional GOOGLE_MAPS_API_KEY secret -- it's
# tried first, with no shared-IP rate limits, and the keyless providers stay as
# backup. The full address line always goes into the lead's Notes regardless.

# ---------------------------------------------------------------------------
# Secrets (do NOT put in this file). Set them once with:
#   npx wrangler secret put SMARTMOVING_PROVIDER_KEY
#   npx wrangler secret put GOOGLE_MAPS_API_KEY      # optional -- better geocoding
# ---------------------------------------------------------------------------
